apiVersion: v1
kind: Pod
metadata:
  name: abctech-pod
  labels:
    app: abctech-ass1
spec:
  containers:
    - name: abctech-ass1
      image: "conyeukwu25/abctech:1.0" #from my public dockerhub
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 5
