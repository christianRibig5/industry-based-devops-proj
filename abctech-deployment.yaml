apiVersion: apps/v1
kind: Deployment
metadata:
  name: abctech
  labels:
    app.kubernetes.io/name: abctech
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: abctech
  template:
    metadata:
      labels:
        app.kubernetes.io/name: abctech
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: abctech
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            # runAsNonRoot: true
            # runAsUser: 1000
          image: "conyeukwu25/abctech:1.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
