apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: catalog-db-secrets
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "dev/mysql/secret"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: "MYSQL_USER"
          - path: password
            objectAlias: "MYSQL_PASSWORD"
    usePodIdentity: "true"
